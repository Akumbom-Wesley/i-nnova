# nginx site for i-nnovacmr.com
#
# Lives at /etc/nginx/sites-available/innova.conf, symlinked into
# sites-enabled. PHP runs in its own php8.4-fpm pool (see innova-fpm.conf, beside this file),
# separate from anything else on the box.
#
# This is the plain HTTP version. certbot --nginx adds the 443 listeners, the
# certificate paths and the HTTP to HTTPS redirect when the certificate is
# issued, so do not hand-edit those back in here.

server {
    listen 80;
    listen [::]:80;
    server_name www.i-nnovacmr.com;
    return 301 https://i-nnovacmr.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name i-nnovacmr.com;

    root /var/www/innova/public;
    index index.php;
    charset utf-8;

    client_max_body_size 24M;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Hashed by Vite, so they never change under the same name.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /storage/ {
        expires 30d;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/innova.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }

    location ~ /\.(?!well-known).* { deny all; }
}

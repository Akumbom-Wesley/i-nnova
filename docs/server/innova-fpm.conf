; php-fpm pool for i-nnovacmr.com
;
; Lives at /etc/php/8.4/fpm/pool.d/innova.conf. The site needs PHP 8.4 or
; newer, while other apps on the box stay on the distribution's 8.3, so it
; gets its own pool on its own socket. The stock www.conf pool for 8.4 is
; renamed to www.conf.disabled because nothing uses it.
;
; ondemand with a low ceiling, because the box has about 1 GB of RAM shared
; with other apps. Idle, this pool costs only its master process.

[innova]
user = www-data
group = www-data
listen = /run/php/innova.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
pm.max_requests = 500
php_admin_value[memory_limit] = 192M
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 24M
